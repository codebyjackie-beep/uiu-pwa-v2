name = "uiu-api"
main = "src/index.ts"
# 2025-09-23+ required for TCP Socket API / TLSSocket (needed by the `mongodb` driver
# under nodejs_compat). Atlas Data API was fully sunset 2025-09-30 — do not revive it.
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Observability so Jack/Edith can read Workers logs (replaces SSH diagnostics).
[observability]
enabled = true

# --- Secrets (set via `wrangler secret put` or CI, NEVER committed) ---
#   MONGODB_URI     Atlas connection string (mongodb+srv://...), official `mongodb` driver
#                   over Workers TCP sockets — no Data API involved.
#   ADMIN_TOKEN     Shared secret checked against the X-Admin-Token header on
#                   /api/admin/* routes (e.g. POST /api/admin/recompute-costs).
#
# --- Non-secret vars ---
[vars]
API_ENV = "production"
MONGODB_DB = "useitup"

# Weekly recipe_cost precompute (Mon 03:00 UTC). Should ideally run after the
# Serper price-refresh chain once that's also on Workers Cron — for now this
# just recomputes against whatever's currently in canonical_price_cache.
#
# DISABLED (2026-07-25): scheduled() runs with dryRun:false — a live cron
# here means production recipe_cost gets written autonomously on next fire,
# bypassing the "populate needs Jackie's sign-off" gate. Explicitly set to
# an empty array (not commented/omitted — omitting the section doesn't
# guarantee an already-deployed trigger gets cleared, an explicit [] does).
# First populate is done manually via POST /api/admin/recompute-costs?write=true
# with a human watching. 等第一次手動 populate 驗證完先填返 "0 3 * * 1"。
[triggers]
crons = []
