name = "uiu-api"
main = "src/index.ts"
# 2025-09-23+ required for TCP Socket API / TLSSocket (needed by the `mongodb` driver
# under nodejs_compat). Atlas Data API was fully sunset 2025-09-30 — do not revive it.
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Observability so Jack/Edith can read Workers logs (replaces SSH diagnostics).
[observability]
enabled = true

# services/brandedImage.ts bundles its hook-overlay font as a build-time asset (Data import,
# raw ArrayBuffer) instead of fetching it per-request — see that file's header comment for why.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# Same file's @kura.nook logo watermark (assets/kn-logo.png, cropped to the badge's actual
# extent then resized to 160x160/~40KB from the original 1024x1024/1.3MB source — see
# brandedImage.ts's KnLogo comment for why it's a crop+resize, not quantize) — bundled the
# same way, base64-embedded per render.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# --- Secrets (set via `wrangler secret put` or CI, NEVER committed) ---
#   MONGODB_URI        Atlas connection string (mongodb+srv://...), official `mongodb` driver
#                       over Workers TCP sockets — no Data API involved.
#   ADMIN_TOKEN         Shared secret checked against the X-Admin-Token header on
#                       /api/admin/* routes (e.g. POST /api/admin/recompute-costs).
#   OPENROUTER_API_KEY  HANDOFF_daily-recipe-draft-agent.md Part B — Jackie's own OpenRouter
#                       key, set by Jackie herself via `wrangler secret put`, never read by
#                       any agent context. Raw value: Key\openrouter-api-key-recipe.txt.
#   RAPIDAPI_KEY        Spoonacular via RapidAPI (same pair as
#   RAPIDAPI_HOST       tools/recipe_ideas/spoonacular_browse.cjs, moved server-side for the
#                       daily cron). Raw values: Key\spoonacular-rapidapi-key.txt.
#   YOUTUBE_API_KEY     OPTIONAL. HANDOFF_recipe-social-import.md §0 — YouTube Tier 2 (video
#                       description via YouTube Data API v3). Jackie opens this herself in
#                       Google Cloud Console; unset -> YouTube links fall straight to Tier 3
#                       manual paste, nothing else in the import flow breaks without it.
#   TELEGRAM_BOT_TOKEN  HANDOFF_pwa-diagnostics-monitor.md — Jackie's own Telegram bot,
#   TELEGRAM_CHAT_ID    set via `wrangler secret put`, never committed/logged. Powers the
#                       PWA diagnostics cron's alert + daily digest messages.
#   CLOUDFLARE_API_TOKEN  OPTIONAL. HANDOFF_pwa-diagnostics-monitor.md — read-only Workers
#   CLOUDFLARE_ACCOUNT_ID  scope, used only so the daily digest can mention the latest deploy.
#                       Unset -> that one info-level line is just omitted, nothing else breaks.
#   IG_TOKEN_UIU        HANDOFF_ig-marketing-affiliate-agent-design.md — Page Access Token
#                       for @useitup.app. Raw value: Key\ig_token_useitup.txt. (IG_ID_UIU
#                       itself is not sensitive — it's a [vars] entry below.)
#   IG_TOKEN_AFFILIATE  Same for @kura.nook. Raw value: Key\ig_token_kuranook.txt. NEVER
#                       used interchangeably with the UIU token — draft.targetAccount picks
#                       which one, never inferred.
#   TELEGRAM_BOT_TOKEN_IG  A SEPARATE bot from TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID above (the
#   TELEGRAM_CHAT_ID_IG    PWA monitor's "UIU Monitor" bot) — content review must not land in
#                       the diagnostics alert chat. Raw token: Key\telegram_bot_token_ig.txt.
#                       Chat id: 8715750614.
#   TELEGRAM_IG_WEBHOOK_SECRET  Random string Jackie generates, registered with Telegram via
#                       setTelegramIgWebhook and checked against the
#                       X-Telegram-Bot-Api-Secret-Token header on POST /api/ig-webhook.
#   SERPER_API_KEY      serper.dev Google Search API — used for both ASIN lookup
#                       (site:amazon.co.uk) and affiliate product photo search. Amazon is
#                       never fetched directly (robots.txt blocks it site-wide).
#   AMAZON_ASSOCIATE_TAG  Jackie's Amazon.co.uk Associates Tracking ID: kuranook2026-21.
#                       Raw value: Key\Amazon Associates Account.txt.
#   ATLAS_CLOUD_API_KEY  cc_prompt_atlas_cloud_bg.md (2026-09-02) — Atlas Cloud unified
#                       inference API key, used for AI-generated IG post background images
#                       (services/atlasCloudImage.ts). Raw value: Key\altas-cloud-api.txt
#                       (note the source file's own "altas" typo).
#
# --- Non-secret vars ---
[vars]
API_ENV = "production"
MONGODB_DB = "useitup"
# HANDOFF_daily-recipe-draft-agent.md Part B — Jackie 2026-07-28 拍板嘅最平 model
# (~$0.09/day for 20 drafts). A [vars] entry, not a secret, so it can change
# without touching secrets. Leading "~" is OpenRouter's auto-updating alias
# syntax (confirmed live 2026-07-31 — bare "openai/gpt-mini-latest" 400s;
# "~openai/gpt-mini-latest" resolves, currently to openai/gpt-5.4-mini).
OPENROUTER_MODEL = "~openai/gpt-mini-latest"
# HANDOFF_fridge-followup.md #2/#4 — Jackie 2026-08-05 拍板 vision model for
# receipt OCR + fridge photo scan. Shares OPENROUTER_API_KEY, separate model
# var so it can change independently of the text-drafting model above.
OPENROUTER_VISION_MODEL = "google/gemini-2.5-flash-lite"
# HANDOFF_pwa-diagnostics-monitor.md — coverage/digest thresholds for the diagnostics
# cron. Jackie hasn't finalized these numbers yet (2026-08-23); these are the
# handoff's suggested starting values, adjustable here without a code change.
PWA_DIAGNOSTICS_RECIPE_COST_MIN_PCT = "50"
PWA_DIAGNOSTICS_NUTRITION_MIN_PCT = "30"
PWA_DIAGNOSTICS_DIGEST_HOUR_UK = "10"
# cc_prompt_affiliate_cadence.md, 2026-09-02 — organic drafts per manual admin-trigger call
# (POST /api/admin/ig-content-batch-run), Jackie fires it herself. Was 6 (5 organic + 1
# affiliate interleaved) before organic/affiliate cadences were split into independent paths;
# affiliate's own cadence is AFFILIATE_CRON_INTERVAL_DAYS in igContentAgent.ts, not this var.
# Not a secret so Jackie can tune batch size without touching secrets.
IG_CONTENT_BATCH_SIZE = "3"
# IG user ids are not sensitive on their own (no auth power without the matching Page
# Access Token secret above) — kept here so they don't need re-setting on every redeploy.
IG_ID_UIU = "17841427988481809"
IG_ID_AFFILIATE = "17841443611128346"
# 2026-08-25 addendum — this Worker's own public URL, used to build the branded-image URL
# (services/igMediaStore.ts) Instagram/shop.useitup.uk fetch. Same value as apps/web's
# API_BASE_URL (apps/web/wrangler.toml) but a separate var — this one points AT this Worker,
# that one points FROM the web Worker TO this one; happen to be the same host today.
PUBLIC_API_BASE_URL = "https://uiu-api.codeby-jackie.workers.dev"

# Five independent crons — scheduled() in index.ts branches on event.cron, the
# jobs are NOT merged:
#   "0 3 * * 1"  Weekly recipe_cost precompute (Mon 03:00 UTC).
#
#   RE-ENABLED (2026-07-25): first populate done manually via
#   POST /api/admin/recompute-costs?write=true, human-watched, 2026-07-25
#   11:55 UTC — count 0 -> 197, verified against golden reference digit-for-
#   digit (1278/1791 = 71.35678%). scheduled() runs with dryRun:false, so this
#   weekly refresh now recomputes over real production data going forward.
#
#   "0 4,7,10,13,16,19,22 * * *"  Daily recipe draft agent
#   (HANDOFF_daily-recipe-draft-agent.md). Fires 7x/day (every 3h) instead of
#   once — 2026-08-05 subrequest-cap fix: dailyRecipeDraft() now only attempts
#   BATCH_SIZE(3) idea specs per invocation and persists the rest of the day's
#   20-spec queue in `recipe_draft_state`, so 7 fires * 3 = 21 >= 20 specs
#   guarantees the queue drains within a day even if a batch mostly fails.
#   Once today's queue is empty, later same-day fires are a cheap no-op
#   (single Mongo read, returns immediately). Cron string is a single
#   comma-hour-list entry (Cloudflare fires it 7x, event.cron reports back
#   the exact same string each time), not 7 separate array entries — keeps
#   the event.cron === match in index.ts a single string comparison.
#   Only ever writes to `recipe_drafts` (status:"pending") — never touches
#   `recipes`/`recipe_cost` until a human clicks Approve in the admin page.
#
#   "0 * * * *"  PWA diagnostics + monitor (HANDOFF_pwa-diagnostics-monitor.md,
#   2026-08-23) — hourly. No VM, no fixed persona (supersedes the old
#   "AI Team moves to a new Hetzner" plan in CLAUDE.md §6/§8, which Jackie
#   dropped 2026-08-22). Every fire runs a handful of read-only health checks
#   (uptime, Mongo connectivity, recipe_cost / nutrition_per_100g coverage,
#   latest deploy) and Telegram-alerts on a critical failure (1h cooldown per
#   unchanged issue set). Once/day at 10am Europe/London wall-clock time
#   (Intl-computed, DST-aware — not a fixed UTC hour) it also asks OpenRouter
#   to write a short digest and Telegram-sends that. State lives in
#   `pwa_diagnostics_state` (single doc, same pattern as recipe_draft_state).
#
#   "0 9 * * *"  IG token expiry check only (services/instagram.ts getTokenExpiry,
#   alert-only — see jobs/igTokenHealth.ts for why this does NOT attempt an
#   automated refresh). Organic IG Content Agent generation used to also fire
#   here (HANDOFF_ig-marketing-affiliate-agent-design.md, 2026-08-24) but moved
#   to manual-trigger-only 2026-09-02 (cc_prompt_affiliate_cadence.md) — Jackie
#   fires POST /api/admin/ig-content-batch-run herself, IG_CONTENT_BATCH_SIZE
#   organic drafts per call, sent to the IG review Telegram bot with
#   Approve/Reject buttons same as before.
#
#   "0 8 * * *"  Affiliate cadence (cc_prompt_affiliate_cadence.md, 2026-09-02) —
#   fires daily but only actually generates once every AFFILIATE_CRON_INTERVAL_DAYS
#   (3) calendar days (igContentAgent.ts's runAffiliateCron); other fires are a
#   cheap no-op single Mongo read. Generates ONE affiliate draft, sent to the same
#   Telegram review bot with the same Approve/Reject flow — nothing publishes to
#   Instagram without a human tap. Deliberately a separate schedule from 09:00 so
#   the two don't fire in the same invocation. Independent of collageThemeIndex
#   (igContentAgent.ts's nextCollageTheme) — the 9-product collage post type stays
#   manual-only (POST /api/admin/ig-content/collage) and does not share this cron.
[triggers]
crons = ["0 3 * * 1", "0 4,7,10,13,16,19,22 * * *", "0 * * * *", "0 9 * * *", "0 8 * * *"]
