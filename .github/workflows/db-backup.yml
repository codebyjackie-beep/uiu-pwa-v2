# Weekly MongoDB backup (Jackie 2026-10-22). Atlas M0 has no automatic backup, so this dumps the
# database every Sunday 02:30 UTC and keeps the gzip archive as a workflow artifact for 90 days.
# THIS REPO IS PUBLIC: anyone signed in to GitHub can download workflow artifacts, so the dump is
# encrypted (gpg AES256, secret BACKUP_PASSPHRASE) before upload and the plain file never leaves the runner.
# Decrypt: gpg --batch --passphrase '<passphrase>' -o uiu-db.archive.gz -d uiu-db.archive.gz.gpg
# Needs repo secret MONGODB_URI_BACKUP (a read-only Atlas user is enough). Restore:
#   mongorestore --uri "<uri>" --archive=uiu-db.archive.gz --gzip --nsInclude='useitup.*'
name: db-backup

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secret
        env:
          URI: ${{ secrets.MONGODB_URI_BACKUP }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ] || [ ${#PASS} -lt 20 ]; then
            echo "::error::Repo secret BACKUP_PASSPHRASE is missing or shorter than 20 characters — the repo is public, so backups are never uploaded unencrypted."
            exit 1
          fi
          if [ -z "$URI" ]; then
            echo "::error::Repo secret MONGODB_URI_BACKUP is not set — add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Check URI shape (no secret printed)
        env:
          URI: ${{ secrets.MONGODB_URI_BACKUP }}
        run: |
          case "$URI" in mongodb+srv://*|mongodb://*) ;; *) echo "::error::URI must start with mongodb+srv://"; exit 1;; esac
          ats=$(printf '%s' "$URI" | tr -cd '@' | wc -c)
          [ "$ats" -eq 1 ] || { echo "::error::URI has $ats '@' characters (expected 1 — a password containing @ must be URL-encoded as %40)"; exit 1; }
          printf '%s' "$URI" | grep -q '[[:space:]]' && { echo "::error::URI contains a space or line break"; exit 1; }
          printf '%s' "$URI" | grep -q '[<>]' && { echo "::error::URI still contains < > placeholders"; exit 1; }
          echo "::notice::URI shape OK"
      - name: mongodump
        env:
          URI: ${{ secrets.MONGODB_URI_BACKUP }}
        run: |
          mkdir -p out
          # Dump only the app database (Atlas free tier refuses admin/local); surface the error as an annotation
          # because job logs aren't readable from cloud sessions. The URI is never echoed.
          docker pull -q mongo:7 >/dev/null
          set +e
          docker run --rm -e URI -v "$PWD/out:/out" mongo:7 \
            sh -c 'mongodump --uri "$URI" --db useitup --archive=/out/uiu-db.archive.gz --gzip' 2> err.txt
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            msg=$(sed -E 's#(mongodb(\+srv)?://)[^ ]*#\1***#g' err.txt | grep -v -e "Pull" -e "Digest" -e "Status:" -e "Pulling" -e "Waiting" -e "Download" -e "Verifying" | tail -4 | tr '\n' ' ' | cut -c1-600)
            echo "::error::mongodump exit $rc: $msg"
            exit 1
          fi
          echo "::notice::dumped $(grep -c 'done dumping' err.txt) collections"
          ls -l out
          sz=$(stat -c%s out/uiu-db.archive.gz); echo "::notice::archive $sz bytes"
          test "$sz" -gt 10000 || { echo "::error::Backup archive is suspiciously small"; exit 1; }
      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o out/uiu-db.archive.gz.gpg out/uiu-db.archive.gz
          rm -f out/uiu-db.archive.gz
          echo "::notice::encrypted $(stat -c%s out/uiu-db.archive.gz.gpg) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: uiu-db-${{ github.run_id }}
          path: out/uiu-db.archive.gz.gpg
          if-no-files-found: error
          retention-days: 90
